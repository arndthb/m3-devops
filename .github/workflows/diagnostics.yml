name: Diagnostics checks
on:
  push:
  pull_request:
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n scripts/check-system.sh
          bash -n scripts/m3.sh
          bash -n scripts/container-manager.sh
          bash -n scripts/project-manager.sh
          bash -n scripts/lib/ui.sh
      - name: Smoke-test interactive m3 menu with PTY
        run: python3 tests/test_m3_menu.py
      - name: Run read-only diagnostics
        run: bash scripts/check-system.sh
