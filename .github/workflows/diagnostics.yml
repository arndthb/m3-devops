name: Diagnostics checks
on:
  push:
  pull_request:
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: ShellCheck shared UI and launchers
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -s bash -e SC1091 scripts/lib/ui.sh scripts/install-launcher.sh
      - name: Smoke-test interactive menus with PTY
        run: python3 tests/test_m3_menu.py
      - name: Run read-only diagnostics
        run: bash scripts/check-system.sh
