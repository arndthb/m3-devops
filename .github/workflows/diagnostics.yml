name: Diagnostics checks
on:
  push:
  pull_request:
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/check-system.sh
      - name: Run read-only diagnostics
        run: bash scripts/check-system.sh
