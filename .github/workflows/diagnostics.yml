name: Diagnostics checks
on:
  push:
  pull_request:
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: ShellCheck all Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0)
          shellcheck -s bash -S warning -e SC1091 "${scripts[@]}"
      - name: Smoke-test interactive menus with PTY
        run: python3 tests/test_m3_menu.py
      - name: Test curated tool install policy using mocked Homebrew
        run: python3 tests/test_tool_install.py
      - name: Test expanded tool detection using fake commands
        run: python3 tests/test_tool_detect.py
      - name: Run read-only diagnostics
        run: bash scripts/check-system.sh
