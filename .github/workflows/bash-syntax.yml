name: Bash syntax validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)
