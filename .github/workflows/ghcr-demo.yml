name: GHCR demo image

on:
  push:
    branches: [main]
    tags: ['demo-v*']
    paths:
      - 'examples/ghcr-demo/**'
      - '.github/workflows/ghcr-demo.yml'
  pull_request:
    paths:
      - 'examples/ghcr-demo/**'
      - '.github/workflows/ghcr-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/ghcr-demo/go.mod
          cache-dependency-path: examples/ghcr-demo/go.mod
      - name: Test
        working-directory: examples/ghcr-demo
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arndthb/m3-devops-demo
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ./examples/ghcr-demo
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
